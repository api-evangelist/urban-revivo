apis:
- name: Urban Revivo UCP Shopping (MCP)
  description: >-
    Agent-driven shopping surface for the Urban Revivo global store, declared in
    the store's UCP merchant profile and llms.txt. Exposes MCP tools for catalog
    search, cart creation, and checkout (create/update/complete), with checkout
    completion always requiring explicit buyer approval. Provided natively by
    the Shopify platform the store runs on.
  humanURL: https://global.urbanrevivo.com/llms.txt
