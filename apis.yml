aid: urban-revivo
name: Urban Revivo
description: >-
  Urban Revivo is a fast-fashion retailer founded in 2006 in Guangzhou, selling
  runway-inspired womenswear, menswear, and accessories through stores across
  Asia and Europe and a global e-commerce storefront, with design centers in
  London, Shanghai, and Guangzhou. Its global online store runs on Shopify and
  exposes an agent-ready commerce surface: a published llms.txt/agents.md agent
  guide, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp,
  and an MCP shopping endpoint offering catalog search, cart, and buyer-approved
  checkout tools, with customer identity brokered by Shopify customer accounts
  over OpenID Connect. Urban Revivo is backed by HongShan (Sequoia China).
